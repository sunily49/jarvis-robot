# JARVIS log rotation — limits journald log size
# Install: sudo cp this_file /etc/logrotate.d/jarvis

# Cap systemd journal size for JARVIS
# This is handled via journald.conf override
# Place this content in /etc/systemd/journald.conf.d/jarvis.conf:
#
# [Journal]
# SystemMaxUse=100M
# MaxRetentionSec=7day
# MaxFileSec=1day
# Compress=yes

# Application log rotation (if file logging is added later)
/home/admin/jarvis/pi/data/*.log {
    daily
    rotate 7
    compress
    delaycompress
    missingok
    notifempty
    create 0644 admin admin
    dateext
    dateformat -%Y%m%d
}

/home/admin/jarvis/pi/data/health.log {
    weekly
    rotate 4
    compress
    missingok
    notifempty
    create 0644 admin admin
}
